<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SystemVerilog 実験ノート · IEEE 1800-2017</title>
<style>
:root{--ink:#152a36;--muted:#536977;--line:#d8e1e5;--paper:#f4f7f6;--card:#fff;--green:#176650;--soft:#e6f2eb;--orange:#a65d1d;--blue:#286186}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:14px;line-height:1.75}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{background:#132d3b;color:#fff;padding:25px 32px 23px;display:flex;gap:30px;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:.16em;color:#aec9d6}h1{font-size:25px;margin:2px 0 4px;letter-spacing:.02em}header p{margin:0;color:#cbdae2;font-size:13px}.stats{display:flex;gap:24px;white-space:nowrap}.stats b{display:block;font-size:28px;font-weight:650;line-height:1.3}.stats span{font-size:11px;color:#b3ccd8}.toolbar{padding:17px 26px 13px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.searchrow{display:flex;gap:10px;max-width:1100px}.searchrow input{min-width:100px;flex:1;border:1px solid #aabdc6;border-radius:7px;padding:9px 12px;background:#fafcfb}.searchrow select{border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--ink);background:#fff}.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tabs button,.smallbtn{border:1px solid var(--line);border-radius:6px;padding:6px 13px;background:#fff;color:var(--ink)}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.layout{display:grid;grid-template-columns:342px minmax(0,1fr);max-width:1700px;margin:auto;align-items:start}.sidebar{padding:16px 13px 30px 22px;max-height:calc(100vh - 259px);overflow:auto;position:sticky;top:135px}.resultinfo{font-size:12px;color:var(--muted);margin:0 8px 10px}.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:12px;margin-bottom:5px;color:var(--ink)}.item:hover{background:#e8eeef}.item.selected{background:#fff;border-color:#86ac9c;box-shadow:0 2px 6px #23352e08}.item strong{display:block;font-size:14px;line-height:1.55}.item small{color:var(--muted);font-size:11px;display:block;margin-top:3px}.detail{padding:24px 30px 60px;min-width:0}.badge{display:inline-block;font-size:11px;line-height:1.7;padding:3px 8px;border-radius:4px;background:#e5edf2;color:#325770;margin:0 5px 4px 0}.badge.ok{color:var(--green);background:var(--soft)}.badge.note{color:#855116;background:#f8edda}.detail h2{font-size:25px;line-height:1.5;margin:6px 0 9px}.lead{color:#415c6a;margin:0 0 19px;font-size:15px}.card{padding:18px 21px;border:1px solid var(--line);background:#fff;border-radius:9px;margin:13px 0}.card h3{font-size:13px;margin:0 0 7px;color:var(--green)}.card p{margin:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cards .card{margin:0}.command{display:flex;gap:12px;align-items:center;background:#173845;color:#e9f5f4;padding:15px 18px;border-radius:7px;margin:12px 0}.command code{flex:1;overflow:auto;font-size:13px;white-space:pre}.command button{background:#dbeee4;color:#174932;border:0;border-radius:5px;padding:5px 14px;white-space:nowrap}.refs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.refs button{border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:#fff;color:var(--blue);font-size:12px}.filebar{display:flex;flex-wrap:wrap;gap:5px;background:#e6edef;padding:10px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;margin-top:22px}.filebar button{border:0;border-radius:4px;padding:5px 11px;background:transparent;color:var(--muted);font-size:12px}.filebar button.active{background:#fff;color:var(--ink)}.source{border:1px solid var(--line);border-radius:0 0 8px 8px;background:#fcfdfd;max-height:620px;overflow:auto;margin:0;padding:14px 0;font:12px/1.9 Consolas,"Cascadia Mono",monospace;tab-size:2}.code-line{display:block;white-space:pre;min-width:max-content;padding:0 20px 0 14px}.ln{display:inline-block;width:33px;color:#8497a3;user-select:none;text-align:right;margin-right:20px}.commentline{color:#397666}.sourcefooter{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:5px;color:var(--muted)}.note-text{font-size:12px;color:var(--muted);padding:10px 0}.progress{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:13px}.pdftext{white-space:pre-wrap;background:#fff;font:13px/1.8 Consolas,"Yu Gothic UI",monospace;border:1px solid var(--line);padding:22px;border-radius:8px;max-height:700px;overflow:auto}.empty{color:var(--muted);padding:40px;text-align:center}.route{display:flex;gap:6px;flex-wrap:wrap}.route button{background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:5px;color:var(--green);font-size:12px}footer{padding:20px 30px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.inlinecontrols{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.inlinecontrols input{border:1px solid var(--line);border-radius:4px;padding:4px 8px;max-width:100%;width:300px}.inlinecontrols label{font-size:12px;color:var(--muted)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5fae91;outline-offset:2px}@media(max-width:900px){header{padding:20px;display:block}.stats{gap:20px;margin-top:14px}.stats b{font-size:22px}.toolbar{padding:12px}.layout{grid-template-columns:260px minmax(0,1fr)}.sidebar{padding-left:10px}.detail{padding:20px 16px}.cards{grid-template-columns:1fr;gap:9px}}@media(max-width:640px){.layout{display:block}.sidebar{position:static;max-height:260px;border-bottom:1px solid var(--line)}.detail{padding:18px 12px}.searchrow{flex-wrap:wrap}.stats span{font-size:10px}h1{font-size:22px}.detail h2{font-size:21px}.command{padding:12px}.command code{font-size:11px}.toolbar{position:static}}
</style>
</head>
<body>
<header><div><div class="eyebrow">IEEE 1800-2017 · LOCAL LEARNING LAB</div><h1>SystemVerilog 実験ノート</h1><p>規格を探す → コードを動かす → 1か所変えて、違いを見る。</p></div><div class="stats" id="stats"></div></header>
<div class="toolbar"><div class="searchrow"><input id="search" aria-label="実験と規格を検索" placeholder="plusargs / default_nettype / 16.9 / mailbox など"><select id="chapter" aria-label="規格の章"><option value="">全章・全付録</option></select><button class="smallbtn" id="clear">クリア</button></div><nav class="tabs" id="tabs" aria-label="索引の種類"></nav></div>
<div class="layout"><aside class="sidebar"><p class="resultinfo" id="resultinfo"></p><div id="results"></div></aside><main class="detail" id="detail"></main></div>
<footer>規格の原本と抽出本文はこのPC内で参照します。学習チェックはこのブラウザーに保存します。実行記録のPASSと「読んだ・試した」の印は別です。<br><a href="README.md">使い方</a> · <a href="VALIDATION.md">作成時の検証記録</a> · <a href="COVERAGE_MAP.md">全節の対応表</a></footer>
<script src="catalog-data.js"></script><script src="reference.local.js"></script>
<script>
'use strict';
const D=window.IEEE_COURSE;
const $=s=>document.querySelector(s);
const E=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
let state={tab:'labs',query:'',chapter:'',selected:'72_integrated_fifo',limit:120};
let done={};try{done=JSON.parse(localStorage.getItem('ieee2017-progress')||'{}')}catch{}
const types={sim:'シミュレーション',compile_fail:'コンパイルの失敗実験',runtime_fail:'実行の失敗実験',dpi:'SV ↔ C / DPI',vpi:'回路探索 / VPI',config:'ライブラリー選択',external:'外部ツールの実験',reference:'規格を読む課題'};
const tabs=[['labs','実験'],['sections','規格の節'],['grammar','文法 BNF'],['keywords','予約語'],['apis','C API'],['pages','PDF 全文']];
const byId=id=>D.catalog.find(x=>x.id===id);
function button(text,action,cls){const b=E('button',text,cls);b.type='button';b.onclick=action;return b}
function badge(text,cls=''){return E('span',text,'badge '+cls)}
function link(text,href){const a=E('a',text);a.href=href;return a}
function setTab(tab,query='',selected=''){state.tab=tab;state.query=query;state.selected=selected;state.limit=120;$('#search').value=query;render()}
function goLab(id){state.tab='labs';state.query='';state.chapter='';state.selected=id;$('#chapter').value='';$('#search').value='';render()}
function labsLinks(ids){const area=E('div',undefined,'route');for(const id of ids){const x=byId(id);if(x)area.append(button(id+' · '+x.title,()=>goLab(id)))}return area}
function card(title,body){const c=E('section',undefined,'card');c.append(E('h3',title),E('p',body));return c}
function sourceView(id,host){const files=D.files[id]||[];if(!files.length)return;const bar=E('div',undefined,'filebar'),pre=E('pre',undefined,'source'),foot=E('div',undefined,'sourcefooter');host.append(bar,pre,foot);let version=0;
 function show(file){version++;const current=version;[...bar.children].forEach(b=>b.classList.toggle('active',b.textContent===file.name));function paint(text){if(current!==version)return;pre.replaceChildren();for(const [i,line]of text.split('\n').entries()){const row=E('span',undefined,'code-line'+(/^\s*\/\//.test(line)?' commentline':''));row.append(E('span',String(i+1),'ln'),document.createTextNode(line));pre.append(row)}pre.scrollTop=0}paint(file.text);foot.replaceChildren(link('ファイルを開く ↗',file.path),E('span','各CHECKが照合点。行番号でコードを辿れます。'));if(location.protocol!=='file:')fetch(file.path).then(r=>{if(!r.ok)throw Error();return r.text()}).then(paint).catch(()=>{});}
 for(const f of files)bar.append(button(f.name,()=>show(f)));show(files.find(f=>f.name==='tb.sv')||files[0]);}
function snapshot(id){const v=D.verification||{};const runtime=(v.runtime?.results||[]).find(x=>x.id===id);const stat=(v.static?.results||[]).find(x=>x.id===id);const row=E('div');if(runtime?.status==='PASS')row.append(badge('Icarus 実行確認済み','ok'));else if(runtime?.status==='EXPECTED_FAIL')row.append(badge('Icarus 期待した失敗を確認','ok'));else row.append(badge('Xceliumで実行確認する項目','note'));if(stat?.status==='STATIC_OK')row.append(badge('pyslang 文法・型検査済み'));if(stat?.status==='EXPECTED_REJECT')row.append(badge('型・名前の拒否を確認'));return row;}
function showLab(x){const host=$('#detail');host.replaceChildren();host.append(badge(x.id),badge(types[x.kind]||x.kind),E('h2',x.title),E('p',x.aim,'lead'));
 const controls=E('div',undefined,'inlinecontrols'),input=E('input');input.id='extraArgs';input.setAttribute('aria-label','実行時引数');input.placeholder='+CYCLES=200 など（必要な実験だけ）';const label=E('label','追加引数');label.htmlFor='extraArgs';controls.append(label,input);host.append(controls);
 const command=E('div',undefined,'command'),code=E('code'),copy=button('コピー',async()=>{try{await navigator.clipboard.writeText(code.textContent);copy.textContent='コピー済み';setTimeout(()=>copy.textContent='コピー',1400)}catch{const sel=getSelection();const range=document.createRange();range.selectNodeContents(code);sel.removeAllRanges();sel.addRange(range);copy.textContent='選択しました'}});function cmd(){const a=input.value.trim();code.textContent='make learn LAB='+x.id+(a?' ARGS='+"'"+a.replaceAll("'", "'\\''")+"'":'')}input.oninput=cmd;cmd();command.append(code,copy);host.append(command);
 const cards=E('div',undefined,'cards');cards.append(card('① 期待する結果',x.expect),card('② 1か所変えてみる',x.change));host.append(cards);
 const refs=E('div',undefined,'refs');refs.append(E('span','仕様書：'));for(const r of x.refs)refs.append(button((/^[A-Q]$/.test(r)?'付録 ':'§ ')+r,()=>{state.chapter='';$('#chapter').value='';setTab('sections',r,r)}));host.append(refs);
 host.append(E('p',x.features.join(' / '),'note-text'));if(x.notes)host.append(card('この実験での注意点',x.notes));
 if(x.kind!=='reference'){host.append(snapshot(x.id),E('p','検証表示は作成時の記録です。Xcelium本体・ライセンス・SimVisionはこのPCでは未検証。実行ログは build/learn-実験ID-xrun/ に保存します。','note-text'))}
 const progress=E('label',undefined,'progress'),check=E('input');check.type='checkbox';check.checked=!!done[x.id];check.onchange=()=>{done[x.id]=check.checked;try{localStorage.setItem('ieee2017-progress',JSON.stringify(done))}catch{};renderList()};progress.append(check,document.createTextNode('読んだ・試した（自分用の学習メモ）'));host.append(progress);sourceView(x.id,host);}
function showPage(page,host){host.append(link('PDF原本のこのページを開く ↗','reference.local.pdf#page='+page));const data=(window.IEEE_PAGES||[])[page-1];if(data){const details=E('details');details.open=true;details.append(E('summary','抽出本文 · PDF p.'+page+'（表・図・太字の組版は原本で確認）'),E('pre',data.text,'pdftext'));host.append(details)}else host.append(E('p','PDF本文はローカル参照ファイルを取り込むと表示されます。READMEの「PDFを持ち運ぶ」を参照。','note-text'));}
function showReference(row){const host=$('#detail');host.replaceChildren();const kind=state.tab;
 if(kind==='sections'){host.append(badge(row.mapping==='explicit-reference'?'実験からの明示参照':'関連する章の実験へ'),badge(row.origin==='contents'?'目次掲載':'本文見出しから抽出'),E('h2','§ '+row.id+' '+row.title),E('p','PDF p.'+row.pdf_page+' / 印刷ページ '+row.printed_page,'lead'),E('p','以下はこの項目を読むための実験の入口です。関連する実験があっても、その節の全規則を検査済みという意味ではありません。','note-text'),labsLinks(row.labs));showPage(row.pdf_page,host);}
 if(kind==='grammar'){host.append(badge(row.annex_a?'付録A':'本文の追加文法'),E('h2',row.symbol),E('pre',row.text,'pdftext'),E('p','BNFは構文の形を記述します。型・スコープ・時間の意味は対応する本文も確認します。以下の抽出は改行や脚注を含むため、組版はPDFが基準です。','note-text'));showPage(row.pdf_page,host);}
 if(kind==='keywords'||kind==='apis'){host.append(badge(kind==='keywords'?'付録Bの予約語':'C API の参照箇所'),E('h2',row.word||row.name),E('p',row.labs.length?'教材のコードに使用例があります。条件付きコンパイルの分岐も含みます。':'原文と発展課題で扱う項目です。教材の実行コードでは直接呼び出していません。','lead'),labsLinks(row.labs));showPage(row.pdf_page,host);}
 if(kind==='pages'){host.append(E('h2','PDF p.'+row.page));showPage(row.page,host);}}
function dataRows(){let rows=state.tab==='labs'?D.catalog:state.tab==='pages'?(window.IEEE_PAGES||[]):D.index[state.tab];const query=state.query.trim().toLowerCase();if(state.chapter)rows=rows.filter(x=>{const c=state.chapter;return state.tab==='labs'?x.refs.some(r=>r===c||r.startsWith(c+'.')):state.tab==='sections'?(x.id===c||x.id.startsWith(c+'.')):true});if(query){const terms=query.split(/\s+/);if(state.tab==='sections'&&/^(?:\d+|[a-q])(?:\.\d+)*$/.test(query))rows=rows.filter(x=>x.id.toLowerCase()===query||x.id.toLowerCase().startsWith(query+'.'));else rows=rows.filter(x=>{let text=state.tab==='pages'?x.text:JSON.stringify(x);return terms.every(t=>text.toLowerCase().includes(t))});rows.sort((a,b)=>Number(rowId(a).toLowerCase()!==query)-Number(rowId(b).toLowerCase()!==query));}return rows;}
function rowId(row){return row.id||row.symbol||row.word||row.name||String(row.page)}
function renderList(){const rows=dataRows();$('#resultinfo').textContent=rows.length+'件 · 学習メモ '+Object.values(done).filter(Boolean).length+'/'+D.catalog.length;const host=$('#results');host.replaceChildren();for(const x of rows.slice(0,state.limit)){const id=rowId(x);let title,sub;if(state.tab==='labs'){title=(done[id]?'✓ ':'')+x.title;sub=x.id+' · '+types[x.kind]}else if(state.tab==='sections'){title=x.id+' '+x.title;sub='PDF p.'+x.pdf_page+' · '+(x.mapping==='explicit-reference'?'明示参照':'章の入口')}else if(state.tab==='pages'){title='PDF p.'+x.page;const q=state.query.toLowerCase();const at=q?x.text.toLowerCase().indexOf(q):0;sub=x.text.slice(Math.max(0,at-35),Math.max(0,at-35)+100).replaceAll('\n',' ')}else{title=x.symbol||x.word||x.name;sub='PDF p.'+x.pdf_page+(x.labs?' · '+x.labs.length+'実験':'')}const b=button('',()=>{state.selected=id;renderList();renderDetail()},'item'+(state.selected===id?' selected':''));b.append(E('strong',title),E('small',sub));host.append(b)}if(rows.length>state.limit)host.append(button('さらに表示',()=>{state.limit+=120;renderList()},'smallbtn'));if(!rows.length)host.append(E('div','見つかりませんでした。検索語や章の絞込みを変えてみてください。','empty'));return rows;}
function renderDetail(){const rows=dataRows();let row=rows.find(x=>rowId(x)===state.selected)||rows[0];if(!row){$('#detail').replaceChildren(E('p','左の検索条件を変更してください。','empty'));return}state.selected=rowId(row);if(state.tab==='labs')showLab(row);else showReference(row);}
function render(){[...$('#tabs').children].forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#chapter').disabled=!['labs','sections'].includes(state.tab);renderDetail();renderList();}
if(!D){$('#detail').textContent='catalog-data.jsが見つかりません。READMEを確認してください。'}else{
 for(const [name,label]of tabs){const b=button(label,()=>setTab(name));b.dataset.tab=name;$('#tabs').append(b)}
 for(const s of D.index.sections.filter(x=>!x.id.includes('.'))){const o=E('option',s.id+' '+s.title);o.value=s.id;$('#chapter').append(o)}
 for(const [n,l] of [[D.catalog.length,'学習シナリオ'],[D.index.toc_count,'目次全項目'],[D.index.keywords.length,'全予約語']]){const div=E('div');div.append(E('b',String(n)),E('span',l));$('#stats').append(div)}
 $('#search').oninput=e=>{state.query=e.target.value;state.selected='';state.limit=120;render()};$('#chapter').onchange=e=>{state.chapter=e.target.value;state.selected='';render()};$('#clear').onclick=()=>{state.query='';state.chapter='';state.selected='';$('#search').value='';$('#chapter').value='';render()};
 render();
}
</script>
</body></html>
